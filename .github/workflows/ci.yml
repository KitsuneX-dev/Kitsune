name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Установка ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check kitsune/ tools/

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Установка зависимостей
        run: |
          pip install -e ".[speedups]"
          pip install mypy
      - name: mypy
        run: mypy kitsune/

  missing-await:
    name: Missing await guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: tools/check_missing_await.py
        run: python tools/check_missing_await.py kitsune

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Установка зависимостей
        run: pip install -e ".[speedups,test]"
      - name: Проверка синтаксиса
        run: python -m compileall -q kitsune/
      - name: pytest
        run: pytest tests/ -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kitsune:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Проверка образа
        run: |
          docker run --rm --entrypoint python kitsune:ci -c \
            "import kitsune.version as v; print('kitsune', v.__version_str__)"
          docker run --rm --entrypoint python -e DOCKER=1 -e KITSUNE_DATA_DIR=/data \
            kitsune:ci -c \
            "from kitsune.paths import data_dir, config_path, is_secondary; \
             assert str(data_dir()) == '/data', data_dir(); \
             assert str(config_path(data_dir())) == '/data/config.toml'; \
             assert not is_secondary(); \
             print('paths OK:', data_dir())"
