services:
  kitsune:
    build:
      context: .
      dockerfile: Dockerfile
    image: kitsune:latest
    container_name: kitsune
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      DOCKER: "1"
      KITSUNE_DATA_DIR: /data
      KITSUNE_WEB_PORT: "8080"
      TZ: ${TZ:-UTC}
    volumes:
      - kitsune-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "/app/tools/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kitsune-data:
    driver: local
